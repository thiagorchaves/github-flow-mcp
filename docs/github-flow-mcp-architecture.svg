<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<rect width="1600" height="900" fill="#0d1117"/><style>.t{font:700 52px system-ui;fill:#f0f6fc}.h{font:700 28px system-ui;fill:#f0f6fc}.s{font:500 21px system-ui;fill:#c9d1d9}.b{fill:#161b22;stroke:#58a6ff;stroke-width:3;rx:20}.a{stroke:#58a6ff;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#58a6ff"/></marker></defs>
<title id="title">AI-Assisted GitHub Workflow with MCP</title><desc id="desc">Infrastructure request flows through an AI agent and MCP policy layer to GitHub, then a pull request and human review before application.</desc>
<text x="800" y="85" text-anchor="middle" class="t">AI-Assisted GitHub Workflow with MCP</text>
<g><rect x="40" y="270" width="190" height="220" class="b"/><text x="135" y="350" text-anchor="middle" class="h">Request</text><text x="135" y="390" text-anchor="middle" class="s">Infrastructure</text>
<rect x="270" y="270" width="190" height="220" class="b"/><text x="365" y="350" text-anchor="middle" class="h">AI Agent</text><text x="365" y="390" text-anchor="middle" class="s">Context</text>
<rect x="500" y="220" width="280" height="320" class="b"/><text x="640" y="295" text-anchor="middle" class="h">MCP Tool Layer</text><text x="640" y="350" text-anchor="middle" class="s">Policy + Validation</text><text x="640" y="395" text-anchor="middle" class="s">Preview Token</text><text x="640" y="440" text-anchor="middle" class="s">Write Guardrails</text>
<rect x="820" y="270" width="190" height="220" class="b"/><text x="915" y="350" text-anchor="middle" class="h">GitHub</text><text x="915" y="390" text-anchor="middle" class="s">Branch / PR</text>
<rect x="1050" y="270" width="190" height="220" class="b"/><text x="1145" y="350" text-anchor="middle" class="h">Pull Request</text><text x="1145" y="390" text-anchor="middle" class="s">Reviewable diff</text>
<rect x="1280" y="270" width="240" height="220" class="b"/><text x="1400" y="350" text-anchor="middle" class="h">Human Review</text><text x="1400" y="390" text-anchor="middle" class="s">Approval / Apply</text></g>
<path d="M230 380H270M460 380H500M780 380H820M1010 380H1050M1240 380H1280" class="a"/>
<rect x="260" y="650" width="1080" height="105" class="b"/><text x="800" y="695" text-anchor="middle" class="h">Remote writes are disabled by default</text><text x="800" y="730" text-anchor="middle" class="s">Branch, PR, and PR-comment mutations require a short-lived token from the exact preview.</text></svg>
