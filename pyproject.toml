[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-flow-mcp"
version = "0.2.0"
description = "Policy-aware MCP server for safe GitHub and GitHub Actions workflows with human-reviewed mutations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thiago Romualdo Chaves" }]
keywords = ["github", "mcp", "model-context-protocol", "devops", "sre", "platform-engineering", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/thiagorchaves/github-flow-mcp"
Repository = "https://github.com/thiagorchaves/github-flow-mcp"
Issues = "https://github.com/thiagorchaves/github-flow-mcp/issues"

[project.scripts]
github-flow-mcp = "github_flow_mcp.server:main"
github-flow-test = "github_flow_mcp.test_connection:main"

[tool.hatch.build.targets.wheel]
packages = ["github_flow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=github_flow_mcp --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
